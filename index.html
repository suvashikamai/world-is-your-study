<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Is Your Study</title>
<meta name="description" content="Real study time builds your own 3D city. Compete with friends in weekly leagues.">
<meta name="theme-color" content="#0e1a26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WIYS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0e1a26; --bg2:#122233; --panel:#16283b; --panel2:#1d3249; --panel3:#243d58; --line:#2b4764; --line2:#37597b;
  --text:#eaf2fb; --muted:#9bb0c7; --dim:#6f86a0;
  --xp:#58d0e8; --coin:#f5bf4f; --fire:#ff7d5c; --grass:#83c96e; --mat:#d99a6c; --epic:#c792ff; --pink:#ff8fab;
  --ok:#83c96e; --warn:#f5bf4f; --bad:#ff6b6b;
  --r:16px; --r2:12px; --r3:999px;
  --display:'Lilita One', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --shadow: 0 10px 30px rgba(3,10,18,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image: radial-gradient(1200px 600px at 80% -10%, rgba(88,208,232,.10), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(245,191,79,.07), transparent 60%);
  background-attachment: fixed;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--xp);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.3px;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1} h2{font-size:22px;line-height:1.15} h3{font-size:18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){ .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g2.collapse{grid-template-columns:1fr} }
.grow{flex:1;min-width:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,#112132,#0e1a26);display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:conic-gradient(from 210deg,var(--xp),var(--grass),var(--coin),var(--fire),var(--xp));display:grid;place-items:center;font-size:20px;box-shadow:inset 0 0 0 3px rgba(14,26,38,.55)}
.brand b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1;display:block}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;position:relative}
.nav a .ic{width:24px;text-align:center;font-size:18px}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.nav a .dot{margin-left:auto;background:var(--fire);color:#1a0d08;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(14,26,38,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .me{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;position:relative}
.avatar.sm{width:32px;height:32px;font-size:17px;border-radius:10px}
.avatar.lg{width:72px;height:72px;font-size:40px;border-radius:20px}
.lvbadge{position:absolute;right:-6px;bottom:-6px;background:var(--bg);border:2px solid var(--xp);color:var(--xp);font:700 10px var(--mono);border-radius:99px;padding:0 5px;line-height:15px}
.xpline{width:150px;max-width:28vw}
.res{display:flex;gap:8px;margin-left:auto;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.pill .num{font-size:13px}
.pill.coin{color:var(--coin)} .pill.fire{color:var(--fire)} .pill.mat{color:var(--mat)} .pill.xp{color:var(--xp)}
.bell{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:40px;height:36px;font-size:17px}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--fire);color:#1a0d08;font:800 11px var(--body);font-style:normal;border-radius:99px;min-width:18px;padding:0 5px;line-height:18px}
.content{padding:22px 24px 110px;max-width:1180px;width:100%;margin:0 auto;padding-inline:max(16px,24px)}
.bottom{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 16px}
  .top .who{display:none}
  .xpline{display:none}
  .res .pill.mat{display:none}
  .content{padding:16px 16px 120px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(17,33,50,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;padding:6px 0;border-radius:12px;position:relative;min-height:52px;justify-content:center}
  .bottom a .ic{font-size:21px;line-height:1}
  .bottom a.on{color:var(--text);background:var(--panel2)}
  .bottom a .dot{position:absolute;top:2px;right:22%;background:var(--fire);width:9px;height:9px;border-radius:99px}
}
@media (max-width:420px){ .res .pill.xp{display:none} }

/* ---------- components ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.tight{padding:14px}
.card.flat{background:var(--bg2)}
.card h2+.muted, .card h3+.muted{margin-top:4px}
.sec{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:26px 0 12px}
.sec:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:800;min-height:44px;background:var(--panel3);color:var(--text);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .08s, filter .15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(1px)}
.btn.gold{background:var(--coin);color:#2a1a02}
.btn.cyan{background:var(--xp);color:#062531}
.btn.green{background:var(--grass);color:#10260a}
.btn.red{background:#e05a5a;color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:10px}
.btn.xl{min-height:58px;font-size:18px;padding:14px 26px;border-radius:16px;font-family:var(--display);font-weight:400;letter-spacing:.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.iconbtn{background:transparent;border:0;color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:15px}
.iconbtn:hover{background:var(--panel2);color:var(--text)}
.bar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--xp);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.gold>i{background:var(--coin)} .bar.fire>i{background:var(--fire)} .bar.green>i{background:var(--grass)} .bar.epic>i{background:var(--epic)} .bar.mat>i{background:var(--mat)}
.bar.thick{height:16px}
.bar.thin{height:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:rgba(131,201,110,.35);background:rgba(131,201,110,.1)}
.chip.warn{color:var(--warn);border-color:rgba(245,191,79,.35);background:rgba(245,191,79,.1)}
.chip.bad{color:var(--bad);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.1)}
.chip.xp{color:var(--xp);border-color:rgba(88,208,232,.35);background:rgba(88,208,232,.1)}
.chip.epic{color:var(--epic);border-color:rgba(199,146,255,.35);background:rgba(199,146,255,.1)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:26px;line-height:1.05}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r2)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--xp)}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:7px 12px;border-radius:9px;min-height:36px}
.seg button.on{background:var(--panel3);color:var(--text)}
.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;background:var(--panel3);border-radius:99px;transition:.2s;pointer-events:none}
.toggle span::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:.2s}
.toggle input:checked+span{background:var(--grass)}
.toggle input:checked+span::after{left:21px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;font-weight:700}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.me td{background:rgba(88,208,232,.07)}
.tblwrap{overflow-x:auto}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1d3a55 0%,#173049 55%,#1a2f3f 100%);border:1px solid var(--line2);border-radius:22px;padding:22px}
.hero .sky{position:absolute;inset:0;pointer-events:none;opacity:.55}
.hero>*{position:relative}
.greet{font-size:32px}
.flame{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;color:var(--fire);background:rgba(255,125,92,.12);border:1px solid rgba(255,125,92,.35);padding:6px 12px;border-radius:12px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c,var(--xp)) calc(var(--p)*1%), rgba(255,255,255,.08) 0);display:grid;place-items:center;flex:none}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.unlock{display:flex;gap:14px;align-items:center}
.unlock .big{font-size:40px;width:64px;height:64px;display:grid;place-items:center;background:var(--bg2);border-radius:16px;flex:none}
.feed .li{align-items:flex-start}
.react{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.react button{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:2px 8px;font-size:13px;min-height:28px}
.react button.on{border-color:var(--coin);background:rgba(245,191,79,.12)}

/* ---------- study ---------- */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 18px;text-align:center}
.clock{font-family:var(--mono);font-weight:700;font-size:64px;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:420px){ .clock{font-size:52px} }
.bigring{position:relative;width:260px;height:260px;max-width:100%}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .inner{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px}
.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mstrip{display:flex;gap:4px;width:100%;max-width:520px}
.mstrip div{flex:1;height:30px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font:700 11px var(--mono);color:var(--dim);border:1px solid var(--line)}
.mstrip div.hit{background:rgba(245,191,79,.16);color:var(--coin);border-color:rgba(245,191,79,.4)}
.subj-dot{width:12px;height:12px;border-radius:4px;flex:none}
.topic{display:flex;gap:10px;align-items:center;padding:7px 0 7px 22px;border-left:2px solid var(--line);margin-left:5px}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;flex:none;font-size:13px;color:#10260a}
.check.on{background:var(--grass);border-color:var(--grass)}
.done-t{text-decoration:line-through;color:var(--dim)}

/* ---------- schedule ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--xp)}
.slot{background:var(--panel2);border-radius:10px;padding:7px 8px;font-size:12.5px;border-left:4px solid var(--c,var(--xp))}
.slot.ok{opacity:.65}

/* ---------- world ---------- */
.worldwrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:#8fc6e8;height:min(64vh,620px);min-height:380px}
.worldwrap canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;align-items:flex-start}
.hud>*{pointer-events:auto}
.glass{background:rgba(12,24,36,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;color:var(--text)}
.hudbtns{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
.hudbtns .btn{background:rgba(12,24,36,.72);color:var(--text)}
.placebar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;white-space:nowrap}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:130px}
.bcard .ic{font-size:30px}
.bcard.lock{opacity:.5}
.bcard:not(.lock):hover{border-color:var(--coin)}
.fallback2d{width:100%;height:100%;display:block;background:#6aa84f}

/* ---------- rewards ---------- */
.quest{display:flex;gap:12px;align-items:center;padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.quest .qi{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:none}
.quest.claim{border-color:rgba(245,191,79,.6);box-shadow:0 0 0 3px rgba(245,191,79,.1)}
.chest{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;text-align:center}
.chest .ci{font-size:44px;line-height:1}
.chest.has .ci{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 8px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.badge .bi{font-size:30px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);filter:grayscale(1);opacity:.55}
.badge.got .bi{filter:none;opacity:1;background:radial-gradient(circle at 30% 30%,#ffe7a8,#f5bf4f 60%,#b8801d);box-shadow:0 0 0 3px rgba(245,191,79,.25)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.track{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.track .node{flex:none;width:78px;text-align:center;padding:10px 6px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:12px}
.track .node.got{border-color:var(--fire);background:rgba(255,125,92,.1)}

/* ---------- stats ---------- */
.meter{display:grid;grid-template-columns:120px 1fr 44px;gap:12px;align-items:center}
.meter b{font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--bg2)}

/* ---------- overlays ---------- */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(5,12,20,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .18s}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:22px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px;box-shadow:var(--shadow);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(860px,100%)}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:scale(.94);opacity:0}}
.toasts{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:rgba(22,40,59,.97);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);animation:tin .25s cubic-bezier(.2,.9,.3,1.2);text-align:center}
.toast.reward{border-color:rgba(245,191,79,.55);color:#ffe3a3}
.toast.big{border-color:var(--xp);color:#c9f4ff;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.4px}
.toast.warn{border-color:var(--bad);color:#ffd0d0}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.float{position:fixed;z-index:90;pointer-events:none;font-family:var(--display);font-size:20px;color:var(--coin);text-shadow:0 2px 0 #3a2500;animation:rise 1.3s ease-out forwards}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.complete-h{font-size:36px;text-align:center;background:linear-gradient(180deg,#fff,#ffe29a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cline{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg2);animation:tin .35s both}
.cline .ci{font-size:20px;width:30px;text-align:center}
.cline .cv{margin-left:auto;font-family:var(--display);font-size:20px}
.ob-step{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.ob-step i{width:26px;height:6px;border-radius:99px;background:var(--panel3)}
.ob-step i.on{background:var(--coin)}
.pickgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
@media (max-width:460px){ .pickgrid{grid-template-columns:repeat(4,1fr)} }
.pickgrid button{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--bg2);font-size:26px;max-width:100%}
.pickgrid button.on{border-color:var(--coin);background:rgba(245,191,79,.12)}
.colpick{display:flex;gap:8px;flex-wrap:wrap}
.colpick button{width:32px;height:32px;border-radius:10px;border:3px solid transparent}
.colpick button.on{border-color:#fff}
.lock-note{padding:12px 14px;border-radius:12px;background:rgba(245,191,79,.1);border:1px solid rgba(245,191,79,.35);color:#ffe3a3;font-size:14px}
.splash{min-height:100%;display:grid;place-items:center;text-align:center;padding:32px 16px}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
